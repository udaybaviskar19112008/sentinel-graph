[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-platform"
version = "0.1.0"
description = "Enterprise phishing-analysis SOC: MIME forensics, header auth, visual spoofing and route topology."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "websockets",  # uvicorn's WebSocket protocol implementation
    "sqlalchemy>=2.0",
    "aiosqlite",
    "requests",
    "tldextract",
    "beautifulsoup4",
    "playwright",
    "torch",
    "torch-geometric",
    "networkx",
    "onnxruntime",
    "numpy",
    "pillow",
    # torch.onnx.export needs these to generate the placeholder vision model.
    "onnx",
    "onnxscript",
    "scikit-learn",
    "matplotlib",  # training plots (ROC, MemAE loss)
    "joblib",
    "shap",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",  # fastapi.testclient
    "mypy",
    "python-docx",  # scripts/generate_custom_report.py
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: whole-system tests through the WebSocket API (real Chromium, real engine loading; ~20 s)",
]
filterwarnings = [
    # Raised inside torch/PyG on Python 3.14 when torch_geometric is imported; not our code.
    "ignore:`torch.jit.script` is not supported in Python 3.14:FutureWarning",
    "ignore:Failing to pass a value to the 'type_params' parameter:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [  # no type information
    "onnxruntime", "onnxruntime.*",
    "onnxruntime_genai", "onnxruntime_genai.*",
    "torch_geometric", "torch_geometric.*",
    "networkx", "networkx.*",
    "sklearn", "sklearn.*",
    "joblib", "joblib.*",
    "shap", "shap.*",
    "tqdm", "tqdm.*",
    "pythoncom", "win32com", "win32com.*",  # pywin32: Word automation in the report generator
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
