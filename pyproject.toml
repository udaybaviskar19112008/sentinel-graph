[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-platform"
version = "0.1.0"
description = "Enterprise phishing-analysis SOC: MIME forensics, header auth, visual spoofing and route topology."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "tldextract",
    "beautifulsoup4",
    "playwright",
    "torch",
    "torch-geometric",
    "networkx",
    "onnxruntime",
    "numpy",
    "pillow",
    # torch.onnx.export needs these to generate the placeholder vision model.
    "onnx",
    "onnxscript",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]  # ships no type information
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
