<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 715" width="1000" height="715">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .st { font-size: 13px; font-style: italic; }
    .nb { font-size: 17px; font-weight: 700; }
    .b { font-size: 15px; font-weight: 700; }
    .m { font-size: 14px; }
    .lbl { font-size: 13px; }
    .node { fill: #fff; stroke: #222; stroke-width: 1.7; }
    .face { fill: #e4e4e4; stroke: #222; stroke-width: 1.4; }
    .env { fill: #f6f6f6; stroke: #222; stroke-width: 1.4; }
    .cmp { fill: #fff; stroke: #222; stroke-width: 1.3; }
    .ln { stroke: #222; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1000" height="715" fill="#fff"/>

  <!-- Workstation node (3D) -->
  <polygon class="face" points="20,50 34,36 764,36 750,50"/>
  <polygon class="face" points="750,50 764,36 764,686 750,700"/>
  <rect class="node" x="20" y="50" width="730" height="650"/>
  <text class="st" x="40" y="74">«device»</text>
  <text class="nb" x="40" y="96">Analyst workstation (one host: Windows 11, Linux or macOS)</text>

  <!-- Browser environment -->
  <rect class="env" x="45" y="125" width="320" height="215"/>
  <text class="st" x="55" y="145">«execution environment»</text>
  <text class="b" x="55" y="165">Web browser</text>
  <rect class="cmp" x="60" y="180" width="290" height="145"/>
  <text class="st" x="72" y="200">«artifact»</text>
  <text class="b" x="72" y="220">React SPA (Vite build)</text>
  <text class="m" x="72" y="245">Live · History · ML forensics · Export</text>
  <text class="m" x="72" y="268">Zustand store · React Flow map</text>
  <text class="m" x="72" y="291">Three.js globe (WebGL)</text>
  <text class="m" x="72" y="314">Geo-IP resolver</text>
  <path d="M322,186 h14 l8,8 v20 h-22 z" fill="#fff" stroke="#222" stroke-width="1.1"/>

  <!-- Vite environment -->
  <rect class="env" x="415" y="125" width="310" height="120"/>
  <text class="st" x="425" y="145">«execution environment»</text>
  <text class="b" x="425" y="166">Node.js · Vite dev server :5173</text>
  <text class="m" x="425" y="195">serves the single-page app</text>
  <text class="m" x="425" y="218">proxies /api and /ws to :8000</text>

  <line class="ln" x1="365" y1="185" x2="415" y2="185"/>
  <text class="lbl" x="390" y="178" text-anchor="middle">HTTP</text>
  <line class="ln" x1="565" y1="245" x2="565" y2="375"/>
  <text class="m" x="577" y="305">HTTP + WebSocket</text>
  <text class="m" x="577" y="325">(dev proxy)</text>

  <!-- Python environment -->
  <rect class="env" x="45" y="375" width="680" height="305"/>
  <text class="st" x="55" y="395">«execution environment»</text>
  <text class="b" x="55" y="415">Python 3.12+ · Uvicorn :8000</text>

  <rect class="cmp" x="60" y="430" width="320" height="110"/>
  <text class="st" x="72" y="450">«component»</text>
  <text class="b" x="72" y="470">FastAPI application</text>
  <text class="m" x="72" y="495">WebSocket API · history REST API</text>
  <text class="m" x="72" y="518">Analysis orchestrator</text>
  <rect x="352" y="438" width="18" height="22" fill="#fff" stroke="#222" stroke-width="1.1"/>
  <rect x="347" y="442" width="10" height="5" fill="#fff" stroke="#222" stroke-width="1.1"/>
  <rect x="347" y="451" width="10" height="5" fill="#fff" stroke="#222" stroke-width="1.1"/>

  <rect class="cmp" x="395" y="430" width="315" height="110"/>
  <text class="st" x="407" y="450">«component»</text>
  <text class="b" x="407" y="470">Inference engines</text>
  <text class="m" x="407" y="495">PyTorch + PyG (MemAE)</text>
  <text class="m" x="407" y="518">ONNX Runtime · scikit-learn · SHAP</text>
  <rect x="682" y="438" width="18" height="22" fill="#fff" stroke="#222" stroke-width="1.1"/>
  <rect x="677" y="442" width="10" height="5" fill="#fff" stroke="#222" stroke-width="1.1"/>
  <rect x="677" y="451" width="10" height="5" fill="#fff" stroke="#222" stroke-width="1.1"/>

  <rect class="cmp" x="60" y="560" width="200" height="105"/>
  <text class="st" x="72" y="580">«artifact»</text>
  <text class="b" x="72" y="600">models/</text>
  <text class="m" x="72" y="625">fusion_meta.joblib</text>
  <text class="m" x="72" y="648">topology/memae.pt</text>

  <path d="M275,575 a100,13 0 0,0 200,0 v78 a100,13 0 0,1 -200,0 z" fill="#fff" stroke="#222" stroke-width="1.3"/>
  <ellipse cx="375" cy="575" rx="100" ry="13" fill="#fff" stroke="#222" stroke-width="1.3"/>
  <text class="st" x="375" y="608" text-anchor="middle">«database»</text>
  <text class="b" x="375" y="628" text-anchor="middle">SQLite</text>
  <text class="m" x="375" y="648" text-anchor="middle">soc_intel.db</text>

  <rect class="cmp" x="490" y="560" width="220" height="105"/>
  <text class="st" x="502" y="580">«component»</text>
  <text class="b" x="502" y="600">Chromium sandbox</text>
  <text class="m" x="502" y="625">headless, JavaScript off</text>
  <text class="m" x="502" y="648">+ loopback egress proxy</text>

  <!-- External: Geo-IP -->
  <polygon class="face" points="800,125 812,113 987,113 975,125"/>
  <polygon class="face" points="975,125 987,113 987,233 975,245"/>
  <rect class="node" x="800" y="125" width="175" height="120"/>
  <text class="st" x="887" y="150" text-anchor="middle">«external service»</text>
  <text class="b" x="887" y="172" text-anchor="middle">ipapi.co</text>
  <text class="m" x="887" y="196" text-anchor="middle">Geo-IP lookup</text>
  <text class="m" x="887" y="218" text-anchor="middle">(optional)</text>
  <polyline class="ln" points="330,125 330,108 790,108 790,185 798,185" marker-end="url(#a)"/>
  <text class="lbl" x="712" y="102" text-anchor="middle">HTTPS (optional)</text>

  <!-- External: lure web server -->
  <polygon class="face" points="800,480 812,468 987,468 975,480"/>
  <polygon class="face" points="975,480 987,468 987,598 975,610"/>
  <rect class="node" x="800" y="480" width="175" height="130"/>
  <text class="st" x="887" y="505" text-anchor="middle">«external node»</text>
  <text class="b" x="887" y="528" text-anchor="middle">Lure web server</text>
  <text class="m" x="887" y="552" text-anchor="middle">first URL of the</text>
  <text class="m" x="887" y="574" text-anchor="middle">email (Internet)</text>
  <polyline class="ln" points="710,600 782,600 782,545 798,545" marker-end="url(#a)"/>
  <text class="lbl" x="887" y="640" text-anchor="middle">HTTP(S) to vetted</text>
  <text class="lbl" x="887" y="658" text-anchor="middle">public IPs only</text>
</svg>
