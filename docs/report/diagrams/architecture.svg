<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .t { font-size: 19px; font-weight: 700; }
    .s { font-size: 16px; }
    .x { font-size: 14px; }
    .box { fill: #fff; stroke: #222; stroke-width: 1.6; }
    .tier { fill: #f1f1f1; stroke: #222; stroke-width: 1.6; }
    .ln { stroke: #222; stroke-width: 1.6; fill: none; }
    .dash { stroke: #555; stroke-width: 1.4; fill: none; stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="1000" fill="#fff"/>

  <!-- Ingestion -->
  <rect class="box" x="190" y="20" width="300" height="50" rx="6"/>
  <text class="t" x="340" y="52" text-anchor="middle">Raw email (.eml file)</text>
  <line class="ln" x1="340" y1="70" x2="340" y2="98" marker-end="url(#a)"/>
  <text class="x" x="350" y="90">one binary WebSocket frame</text>

  <rect class="box" x="40" y="100" width="600" height="66" rx="6"/>
  <text class="t" x="340" y="127" text-anchor="middle">FastAPI WebSocket API</text>
  <text class="s" x="340" y="152" text-anchor="middle">/ws/api/v1/stream-analysis · Origin check · 16 MiB limit</text>
  <line class="ln" x1="340" y1="166" x2="340" y2="190" marker-end="url(#a)"/>

  <!-- Tier 1 -->
  <rect class="tier" x="40" y="192" width="600" height="112" rx="6"/>
  <text class="t" x="340" y="219" text-anchor="middle">Tier 1 · Protocol forensics</text>
  <text class="s" x="340" y="245" text-anchor="middle">MIME unpacking · URL extraction (WHATWG rules)</text>
  <text class="s" x="340" y="268" text-anchor="middle">SPF / DKIM / DMARC / ARC · display-name spoofing</text>
  <text class="s" x="340" y="291" text-anchor="middle">Received-chain route · DGA entropy · NLP coercion</text>

  <!-- Fan-out -->
  <line class="ln" x1="185" y1="304" x2="185" y2="348" marker-end="url(#a)"/>
  <line class="ln" x1="495" y1="304" x2="495" y2="348" marker-end="url(#a)"/>
  <text class="x" x="340" y="331" text-anchor="middle">asyncio.gather (concurrent)</text>

  <rect class="tier" x="40" y="350" width="290" height="124" rx="6"/>
  <text class="t" x="185" y="377" text-anchor="middle">Tier 2 · Vision</text>
  <text class="s" x="185" y="403" text-anchor="middle">Chromium sandbox, JS off</text>
  <text class="s" x="185" y="426" text-anchor="middle">Egress proxy: public IPs only</text>
  <text class="s" x="185" y="449" text-anchor="middle">Screenshot → ONNX embedding</text>

  <rect class="tier" x="350" y="350" width="290" height="124" rx="6"/>
  <text class="t" x="495" y="377" text-anchor="middle">Tier 3 · Topology</text>
  <text class="s" x="495" y="403" text-anchor="middle">Delivery DAG (PyTorch Geometric)</text>
  <text class="s" x="495" y="426" text-anchor="middle">GCN encoder + MemAE memory</text>
  <text class="s" x="495" y="449" text-anchor="middle">Loss → zero-day flag (&gt; 1.10)</text>

  <line class="ln" x1="185" y1="474" x2="285" y2="518" marker-end="url(#a)"/>
  <line class="ln" x1="495" y1="474" x2="395" y2="518" marker-end="url(#a)"/>

  <!-- Tier 4 -->
  <rect class="tier" x="40" y="520" width="600" height="88" rx="6"/>
  <text class="t" x="340" y="547" text-anchor="middle">Tier 4 · Local small language model (Phi-3 slot)</text>
  <text class="s" x="340" y="572" text-anchor="middle">Injection-hardened prompt → streamed reasoning</text>
  <text class="s" x="340" y="595" text-anchor="middle">Verdict extraction: escalate, never downgrade</text>
  <line class="ln" x1="340" y1="608" x2="340" y2="632" marker-end="url(#a)"/>

  <!-- Fusion -->
  <rect class="tier" x="40" y="634" width="600" height="88" rx="6"/>
  <text class="t" x="340" y="661" text-anchor="middle">Late fusion · Random Forest over 12 features</text>
  <text class="s" x="340" y="686" text-anchor="middle">Exact TreeSHAP attribution per feature and subsystem</text>
  <text class="s" x="340" y="709" text-anchor="middle">Risk score 0–100 · model-status flags</text>
  <line class="ln" x1="340" y1="722" x2="340" y2="746" marker-end="url(#a)"/>

  <rect class="box" x="140" y="748" width="400" height="50" rx="6"/>
  <text class="t" x="340" y="780" text-anchor="middle">ThreatAssessment (strict Pydantic)</text>
  <line class="ln" x1="300" y1="798" x2="200" y2="822" marker-end="url(#a)"/>

  <!-- Persistence -->
  <rect class="box" x="40" y="824" width="290" height="72" rx="6"/>
  <text class="t" x="185" y="852" text-anchor="middle">SQLite scan history</text>
  <text class="s" x="185" y="877" text-anchor="middle">scans and indicators</text>
  <line class="ln" x1="330" y1="860" x2="348" y2="860" marker-end="url(#a)"/>

  <rect class="box" x="350" y="824" width="290" height="72" rx="6"/>
  <text class="t" x="495" y="852" text-anchor="middle">REST history API</text>
  <text class="s" x="495" y="877" text-anchor="middle">/api/v1/history · pivots</text>
  <line class="ln" x1="640" y1="860" x2="678" y2="860" marker-end="url(#a)"/>

  <!-- Telemetry bus -->
  <line class="dash" x1="640" y1="133" x2="660" y2="133"/>
  <line class="dash" x1="640" y1="248" x2="660" y2="248"/>
  <line class="dash" x1="640" y1="412" x2="660" y2="412"/>
  <line class="dash" x1="640" y1="564" x2="660" y2="564"/>
  <line class="dash" x1="640" y1="678" x2="660" y2="678"/>
  <line class="dash" x1="660" y1="133" x2="660" y2="678"/>
  <line class="dash" x1="660" y1="175" x2="694" y2="175" marker-end="url(#g)"/>

  <!-- Dashboard -->
  <rect class="box" x="680" y="100" width="200" height="796" rx="6"/>
  <text class="t" x="780" y="128" text-anchor="middle">React dashboard</text>
  <rect class="tier" x="696" y="150" width="168" height="50" rx="5"/>
  <text class="s" x="780" y="181" text-anchor="middle">Zustand store</text>
  <rect class="box" x="696" y="225" width="168" height="70" rx="5"/>
  <text class="t" x="780" y="253" text-anchor="middle">Live scan</text>
  <text class="x" x="780" y="278" text-anchor="middle">globe · route map</text>
  <rect class="box" x="696" y="315" width="168" height="70" rx="5"/>
  <text class="t" x="780" y="343" text-anchor="middle">ML forensics</text>
  <text class="x" x="780" y="368" text-anchor="middle">SHAP per feature</text>
  <rect class="box" x="696" y="405" width="168" height="70" rx="5"/>
  <text class="t" x="780" y="433" text-anchor="middle">History</text>
  <text class="x" x="780" y="458" text-anchor="middle">indicator pivots</text>
  <rect class="box" x="696" y="495" width="168" height="70" rx="5"/>
  <text class="t" x="780" y="523" text-anchor="middle">Export</text>
  <text class="x" x="780" y="548" text-anchor="middle">JSON / CSV</text>
  <rect class="box" x="696" y="585" width="168" height="70" rx="5"/>
  <text class="t" x="780" y="613" text-anchor="middle">Geo-IP resolver</text>
  <text class="x" x="780" y="638" text-anchor="middle">ipapi.co or hashed</text>
  <rect class="box" x="696" y="675" width="168" height="70" rx="5"/>
  <text class="t" x="780" y="703" text-anchor="middle">Three.js globe</text>
  <text class="x" x="780" y="728" text-anchor="middle">hop-to-hop arcs</text>

  <!-- Legend -->
  <line class="ln" x1="60" y1="944" x2="110" y2="944" marker-end="url(#a)"/>
  <text class="x" x="120" y="949">data flow</text>
  <line class="dash" x1="230" y1="944" x2="280" y2="944"/>
  <text class="x" x="290" y="949">telemetry event streamed to the dashboard</text>
  <rect class="tier" x="620" y="934" width="30" height="20"/>
  <text class="x" x="660" y="949">analysis tier</text>
</svg>
